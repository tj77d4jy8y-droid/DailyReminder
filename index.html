<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Mein Tag"/>
  <meta name="theme-color" content="#0a0a0f"/>
  <title>Mein Tag</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{
      --bg:#0a0a0f;
      --card:#13131a;
      --card2:#1a1a24;
      --border:#22222e;
      --accent:#a78bfa;
      --accent2:#7c3aed;
      --gold:#f59e0b;
      --green:#10b981;
      --red:#f87171;
      --blue:#60a5fa;
      --text:#f1f0ff;
      --muted:#6b7280;
      --dim:#374151;
    }
    html,body{min-height:100vh;background:var(--bg)}
    body{
      font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;
      color:var(--text);
      max-width:480px;
      margin:0 auto;
      padding-bottom:120px;
    }

    /* ── GREETING ── */
    .greeting-block{padding:52px 24px 8px}
    .greeting-time{font-size:13px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
    .greeting-text{font-size:28px;font-weight:700;line-height:1.2;letter-spacing:-0.5px}
    .greeting-text span{color:var(--accent)}
    .greeting-sub{font-size:14px;color:var(--muted);margin-top:6px}

    /* ── PROGRESS ── */
    .progress-wrap{margin:20px 24px 0}
    .progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}
    .progress-bar{height:6px;background:var(--border);border-radius:99px;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px;transition:width 0.6s cubic-bezier(.4,0,.2,1)}

    /* ── SECTION ── */
    .section{padding:24px 24px 0}
    .section-title{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}

    /* ── ITEM CARD ── */
    .item-card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      padding:14px 16px;
      margin-bottom:10px;
      display:flex;
      align-items:center;
      gap:14px;
      cursor:pointer;
      transition:all 0.2s;
      position:relative;
      overflow:hidden;
    }
    .item-card::before{
      content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
      background:var(--item-color,var(--accent));
      border-radius:3px 0 0 3px;
    }
    .item-card.done{opacity:0.5}
    .item-card.done .item-title{text-decoration:line-through;color:var(--muted)}
    .item-icon{
      width:40px;height:40px;border-radius:12px;
      display:flex;align-items:center;justify-content:center;
      font-size:20px;flex-shrink:0;
      background:var(--item-color,var(--accent))18;
    }
    .item-info{flex:1;min-width:0}
    .item-title{font-size:15px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .item-sub{font-size:12px;color:var(--muted)}
    .item-check{
      width:26px;height:26px;border-radius:50%;
      border:2px solid var(--border);
      display:flex;align-items:center;justify-content:center;
      font-size:14px;flex-shrink:0;
      transition:all 0.2s;
      background:transparent;
    }
    .item-card.done .item-check{
      background:var(--green);border-color:var(--green);color:#fff;
    }

    /* ── FAB ── */
    .fab-row{
      position:fixed;bottom:32px;
      left:50%;transform:translateX(-50%);
      display:flex;gap:12px;
      z-index:100;
    }
    .fab{
      height:52px;border-radius:26px;
      border:none;cursor:pointer;
      font-size:14px;font-weight:700;
      font-family:inherit;
      display:flex;align-items:center;gap:8px;
      padding:0 20px;
      box-shadow:0 8px 32px #0008;
      transition:transform 0.15s;
    }
    .fab:active{transform:scale(0.96)}
    .fab-add{background:var(--accent);color:#fff}
    .fab-reset{background:var(--card2);color:var(--muted);border:1px solid var(--border)}

    /* ── MODAL OVERLAY ── */
    .overlay{
      position:fixed;inset:0;
      background:#0009;backdrop-filter:blur(8px);
      z-index:200;display:flex;align-items:flex-end;
      opacity:0;pointer-events:none;transition:opacity 0.25s;
    }
    .overlay.show{opacity:1;pointer-events:all}
    .sheet{
      background:var(--card);
      border-radius:24px 24px 0 0;
      padding:28px 24px 48px;
      width:100%;
      transform:translateY(100%);
      transition:transform 0.3s cubic-bezier(.4,0,.2,1);
    }
    .overlay.show .sheet{transform:translateY(0)}
    .sheet-title{font-size:18px;font-weight:700;margin-bottom:20px;text-align:center}
    .sheet-close{
      position:absolute;top:16px;right:20px;
      background:var(--card2);border:none;
      width:30px;height:30px;border-radius:50%;
      color:var(--muted);font-size:18px;cursor:pointer;
    }
    label{display:block;font-size:12px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;margin-top:16px}
    input,select{
      width:100%;background:var(--card2);
      border:1px solid var(--border);border-radius:12px;
      padding:12px 14px;color:var(--text);
      font-size:15px;font-family:inherit;outline:none;
    }
    select option{background:var(--card2)}
    .emoji-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
    .emoji-btn{
      width:40px;height:40px;border-radius:10px;
      background:var(--card2);border:1px solid var(--border);
      font-size:20px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      transition:all 0.15s;
    }
    .emoji-btn.sel{border-color:var(--accent);background:#a78bfa22}
    .color-row{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap}
    .color-btn{
      width:32px;height:32px;border-radius:50%;
      border:3px solid transparent;cursor:pointer;transition:all 0.15s;
    }
    .color-btn.sel{border-color:var(--text);transform:scale(1.15)}
    .save-btn{
      width:100%;margin-top:24px;padding:15px;
      background:var(--accent);color:#fff;
      border:none;border-radius:14px;
      font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;
    }

    /* ── POPUP REMINDER ── */
    .reminder-popup{
      position:fixed;top:0;left:50%;transform:translateX(-50%);
      width:min(440px,calc(100% - 32px));
      background:var(--card);
      border:1px solid var(--accent);
      border-radius:0 0 20px 20px;
      padding:52px 20px 20px;
      z-index:300;
      box-shadow:0 8px 40px #a78bfa33;
      display:none;
    }
    .reminder-popup.show{display:block;animation:slideDown 0.4s cubic-bezier(.4,0,.2,1)}
    @keyframes slideDown{from{transform:translateX(-50%) translateY(-100%)}to{transform:translateX(-50%) translateY(0)}}
    .popup-emoji{font-size:32px;margin-bottom:8px}
    .popup-title{font-size:18px;font-weight:700;margin-bottom:4px}
    .popup-sub{font-size:14px;color:var(--muted)}
    .popup-close{
      position:absolute;top:54px;right:16px;
      background:transparent;border:none;
      color:var(--muted);font-size:22px;cursor:pointer;
    }

    /* ── EMPTY STATE ── */
    .empty{text-align:center;padding:40px 0;color:var(--dim);font-size:14px;line-height:2}

    /* ── ANIMATIONS ── */
    .item-card{animation:fadeUp 0.3s ease both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>
<body>

<!-- GREETING -->
<div class="greeting-block">
  <div class="greeting-time" id="greeting-time"></div>
  <div class="greeting-text" id="greeting-text"></div>
  <div class="greeting-sub" id="greeting-sub"></div>
</div>

<!-- PROGRESS -->
<div class="progress-wrap">
  <div class="progress-label">
    <span>Tagesfortschritt</span>
    <span id="progress-label-val">0 / 0 erledigt</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
</div>

<!-- MEDIKAMENTE -->
<div class="section">
  <div class="section-title">💊 Medikamente</div>
  <div id="list-med"></div>
</div>

<!-- GEWOHNHEITEN -->
<div class="section">
  <div class="section-title">⚡ Gewohnheiten</div>
  <div id="list-habit"></div>
</div>

<!-- FAB -->
<div class="fab-row">
  <button class="fab fab-reset" onclick="resetDay()">🔄 Neu starten</button>
  <button class="fab fab-add" onclick="openSheet()">+ Hinzufügen</button>
</div>

<!-- ADD SHEET -->
<div class="overlay" id="overlay" onclick="closeSheet(event)">
  <div class="sheet" style="position:relative">
    <button class="sheet-close" onclick="closeSheet()">×</button>
    <div class="sheet-title">Neuer Eintrag</div>

    <label>Typ</label>
    <select id="form-type">
      <option value="med">💊 Medikament</option>
      <option value="habit">⚡ Gewohnheit</option>
    </select>

    <label>Name</label>
    <input id="form-name" placeholder="z.B. Vitamin D, Wasser trinken..." maxlength="40"/>

    <label>Uhrzeit (für Erinnerung)</label>
    <input id="form-time" type="time"/>

    <label>Emoji</label>
    <div class="emoji-row" id="emoji-row"></div>

    <label>Farbe</label>
    <div class="color-row" id="color-row"></div>

    <button class="save-btn" onclick="saveItem()">Speichern ✓</button>
  </div>
</div>

<!-- REMINDER POPUP -->
<div class="reminder-popup" id="reminder-popup">
  <div class="popup-emoji" id="popup-emoji"></div>
  <div class="popup-title" id="popup-title"></div>
  <div class="popup-sub" id="popup-sub"></div>
  <button class="popup-close" onclick="closePopup()">×</button>
</div>

<script>
// ── DATA ──
const STORAGE_KEY = 'mein_tag_v2';
const DONE_KEY    = 'mein_tag_done_v2';
const EMOJIS = ['💊','💉','🩺','🧴','🥗','🏃','💧','☕','🧘','😴','🍎','🧠','🦷','🫀','🌿','⚡','📖','🎯'];
const COLORS = ['#a78bfa','#f59e0b','#10b981','#60a5fa','#f87171','#fb923c','#e879f9','#34d399'];

let items = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let done  = JSON.parse(localStorage.getItem(DONE_KEY)    || '{}');
let selEmoji = EMOJIS[0];
let selColor = COLORS[0];
let popupQueue = [];
let popupShowing = false;

// ── RESET DONE DAILY ──
const today = new Date().toDateString();
if (done._date !== today) { done = {_date: today}; saveDone(); }

function saveItems(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }
function saveDone(){  localStorage.setItem(DONE_KEY,    JSON.stringify(done));  }

// ── GREETING ──
function updateGreeting(){
  const h = new Date().getHours();
  const m = new Date().getMinutes();
  const timeStr = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
  let g = h < 5 ? 'Gute Nacht' : h < 12 ? 'Guten Morgen' : h < 17 ? 'Guten Tag' : h < 21 ? 'Guten Abend' : 'Gute Nacht';
  const total = items.length;
  const doneCount = items.filter(i => done[i.id]).length;
  const left = total - doneCount;
  document.getElementById('greeting-time').textContent = timeStr + ' Uhr';
  document.getElementById('greeting-text').innerHTML = g + ' <span>👋</span>';
  document.getElementById('greeting-sub').textContent =
    total === 0 ? 'Füge deine täglichen Aufgaben hinzu.' :
    left === 0  ? 'Alles erledigt – super gemacht! 🎉' :
                  left + ' von ' + total + ' Dingen noch offen.';
}

// ── PROGRESS ──
function updateProgress(){
  const total = items.length;
  const doneCount = items.filter(i => done[i.id]).length;
  const pct = total ? Math.round(doneCount/total*100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-label-val').textContent = doneCount + ' / ' + total + ' erledigt';
}

// ── RENDER ──
function render(){
  updateGreeting();
  updateProgress();
  const meds   = items.filter(i => i.type === 'med');
  const habits = items.filter(i => i.type === 'habit');
  renderList('list-med',   meds,   '💊 Noch keine Medikamente.\nTippe auf + um eines hinzuzufügen.');
  renderList('list-habit', habits, '⚡ Noch keine Gewohnheiten.\nTippe auf + um eine hinzuzufügen.');
}

function renderList(id, arr, emptyMsg){
  const el = document.getElementById(id);
  if(!arr.length){ el.innerHTML = `<div class="empty">${emptyMsg}</div>`; return; }
  el.innerHTML = arr.map((item,i) => {
    const isDone = !!done[item.id];
    return `
    <div class="item-card ${isDone?'done':''}"
         style="--item-color:${item.color};animation-delay:${i*0.05}s"
         onclick="toggle('${item.id}')">
      <div class="item-icon">${item.emoji}</div>
      <div class="item-info">
        <div class="item-title">${item.name}</div>
        <div class="item-sub">${item.time ? '⏰ ' + item.time + ' Uhr' : 'Kein fester Zeitpunkt'}</div>
      </div>
      <div class="item-check">${isDone ? '✓' : ''}</div>
      <button onclick="deleteItem(event,'${item.id}')"
        style="position:absolute;top:8px;right:8px;background:transparent;border:none;
               color:#444;font-size:16px;cursor:pointer;padding:4px">×</button>
    </div>`;
  }).join('');
}

// ── TOGGLE ──
function toggle(id){
  done[id] = !done[id];
  if(!done[id]) delete done[id];
  saveDone();
  render();
}

// ── DELETE ──
function deleteItem(e, id){
  e.stopPropagation();
  items = items.filter(i => i.id !== id);
  delete done[id];
  saveItems(); saveDone(); render();
}

// ── RESET ──
function resetDay(){
  if(!confirm('Alle Häkchen für heute zurücksetzen?')) return;
  done = {_date: today};
  saveDone(); render();
}

// ── SHEET ──
function openSheet(){
  // emoji row
  document.getElementById('emoji-row').innerHTML =
    EMOJIS.map(e => `<button class="emoji-btn ${e===selEmoji?'sel':''}" onclick="pickEmoji('${e}')">${e}</button>`).join('');
  // color row
  document.getElementById('color-row').innerHTML =
    COLORS.map(c => `<button class="color-btn ${c===selColor?'sel':''}" style="background:${c}" onclick="pickColor('${c}')"></button>`).join('');
  document.getElementById('form-name').value='';
  document.getElementById('form-time').value='';
  document.getElementById('overlay').classList.add('show');
}
function closeSheet(e){
  if(e && e.target !== document.getElementById('overlay')) return;
  document.getElementById('overlay').classList.remove('show');
}
function pickEmoji(e){
  selEmoji = e;
  document.querySelectorAll('.emoji-btn').forEach(b => b.classList.toggle('sel', b.textContent===e));
}
function pickColor(c){
  selColor = c;
  document.querySelectorAll('.color-btn').forEach(b => b.classList.toggle('sel', b.style.background===c));
}

// ── SAVE ──
function saveItem(){
  const name = document.getElementById('form-name').value.trim();
  if(!name){ document.getElementById('form-name').focus(); return; }
  const item = {
    id:    Date.now().toString(),
    type:  document.getElementById('form-type').value,
    name,
    time:  document.getElementById('form-time').value,
    emoji: selEmoji,
    color: selColor,
  };
  items.push(item);
  saveItems();
  document.getElementById('overlay').classList.remove('show');
  render();
  // schedule popup if time set
  if(item.time) schedulePopup(item);
}

// ── REMINDERS ──
function schedulePopup(item){
  const [h,m] = item.time.split(':').map(Number);
  const now = new Date();
  const target = new Date();
  target.setHours(h,m,0,0);
  let delay = target - now;
  if(delay < 0) return; // already passed today
  setTimeout(() => showPopup(item), delay);
}

function showPopup(item){
  if(!done[item.id]){ // only show if not done
    popupQueue.push(item);
    if(!popupShowing) nextPopup();
  }
}

function nextPopup(){
  if(!popupQueue.length){ popupShowing=false; return; }
  popupShowing = true;
  const item = popupQueue.shift();
  document.getElementById('popup-emoji').textContent = item.emoji;
  document.getElementById('popup-title').textContent = item.name;
  document.getElementById('popup-sub').textContent   = '⏰ ' + item.time + ' Uhr – Zeit für: ' + item.name;
  const popup = document.getElementById('reminder-popup');
  popup.classList.add('show');

  // Request notification permission & send
  if('Notification' in window && Notification.permission === 'granted'){
    new Notification('⏰ ' + item.name, { body: 'Zeit für: ' + item.name, icon: '' });
  }

  setTimeout(closePopup, 8000);
}

function closePopup(){
  document.getElementById('reminder-popup').classList.remove('show');
  setTimeout(nextPopup, 400);
}

// ── REQUEST NOTIFICATION PERMISSION ──
function requestNotifPermission(){
  if('Notification' in window && Notification.permission === 'default'){
    Notification.requestPermission();
  }
}

// ── INIT ──
function init(){
  requestNotifPermission();
  render();
  // schedule all existing items
  items.forEach(item => { if(item.time && !done[item.id]) schedulePopup(item); });
  // update clock every minute
  setInterval(updateGreeting, 60000);
}

// ── DEFAULT ITEMS if empty ──
if(items.length === 0){
  items = [
    {id:'1',type:'med',  name:'Vitamin D',       time:'08:00',emoji:'💊',color:'#a78bfa'},
    {id:'2',type:'med',  name:'Magnesium',        time:'21:00',emoji:'💉',color:'#f87171'},
    {id:'3',type:'habit',name:'2L Wasser trinken',time:'',     emoji:'💧',color:'#60a5fa'},
    {id:'4',type:'habit',name:'10 Min. Bewegung', time:'09:00',emoji:'🏃',color:'#10b981'},
  ];
  saveItems();
}

init();
</script>
</body>
</html>
